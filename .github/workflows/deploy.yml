name: Deploy Angular and API to Server

on:
  push:
    branches: [ development ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. Frontend (Angular) ---
      - name: Use Node for Angular
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (Angular)
        run: npm ci

      - name: Inject Secrets into Environment
        run: |
          # Ersetze den User-Platzhalter
          sed -i 's|USER|${{ secrets.USER }}|g' src/environments/environment.prod.ts
          
          # Ersetze den Passwort-Platzhalter
          sed -i 's|PASSWORD|${{ secrets.PASSWORD }}|g' src/environments/environment.prod.ts

      - name: Build Angular
        run: npm run build

      # --- 2. Backend (Node.js API) ---
      - name: Install dependencies (Backend)
        run: |
          cd backend
          # Installiere nur Production-Dependencies (kleiner & schneller)
          npm ci --production

      # --- 3. Deployment (Kopieren) ---
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Kopiert dist/ und backend/ rekursiv
          source: "dist,backend" 
          # Zielordner auf dem Server
          target: "/data/compose/1"
          # WICHTIG: strip_components entfernen oder auf 0 setzen!
          # Damit behält er die Struktur:
          # /data/compose/1/dist/...
          # /data/compose/1/backend/...

      # --- 4. Restart Services ---
      - name: Restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Angular Container neu starten (lädt neue HTML/JS)
            docker restart angular-nginx
            
            # API Container neu starten (lädt neuen Node Code)
            # "|| true" verhindert Fehler, falls der Container beim ersten Mal noch nicht läuft
            docker restart sonnenhof-api || true
