name: Deploy Angular to Server

on:
  push:
    branches: [ development ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Inject Secrets into Environment
        run: |
          # Ersetze den User-Platzhalter
          sed -i 's|USER|${{ secrets.USER }}|g' src/environments/environment.prod.ts
          
          # Ersetze den Passwort-Platzhalter
          sed -i 's|PASSWORD|${{ secrets.PASSWORD }}|g' src/environments/environment.prod.ts

      - name: Build Angular
        run: npm run build

      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/**"
          target: "/data/compose/1/dist"
          strip_components: 1

      - name: Restart nginx container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker restart angular-nginx
