name: 🚀 Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '20.x'
  BUILD_PATH: './dist/sonnenhof-management-ui'

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy Development
    runs-on: ubuntu-latest
    
    environment:
      name: development
      url: https://sonnenhof-dev.vercel.app
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: 📦 Install Dependencies
      run: npm ci
    
    - name: 🔍 Run Linting
      run: npm run lint
    
    - name: 🧪 Run Tests
      run: npm run test -- --watch=false --browsers=ChromeHeadless
    
    - name: 🏗️ Build Application
      run: npm run build -- --configuration development
      env:
        NODE_OPTIONS: --max_old_space_size=8192
    
    - name: 📝 Generate Build Info
      run: |
        echo "Build: ${{ github.sha }}" > ${{ env.BUILD_PATH }}/build-info.txt
        echo "Branch: ${{ github.ref_name }}" >> ${{ env.BUILD_PATH }}/build-info.txt
        echo "Timestamp: $(date)" >> ${{ env.BUILD_PATH }}/build-info.txt
    
    # Option 1: Vercel Deployment (Empfohlen)
    - name: 🚀 Deploy to Vercel
      uses: vercel/action@v1
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./
        vercel-args: '--prod --alias=sonnenhof-dev'
    
    # Option 2: GitHub Pages (Alternative)
    # - name: 🌐 Deploy to GitHub Pages
    #   uses: peaceiris/actions-gh-pages@v3
    #   with:
    #     github_token: ${{ secrets.GITHUB_TOKEN }}
    #     publish_dir: ${{ env.BUILD_PATH }}
    #     cname: sonnenhof-dev.your-domain.com
    
    - name: 📧 Deployment Notification
      if: success()
      run: |
        echo "🎉 Development deployment successful!"
        echo "URL: https://sonnenhof-dev.vercel.app"
    
    - name: ❌ Deployment Failed
      if: failure()
      run: |
        echo "💥 Development deployment failed!"
        exit 1