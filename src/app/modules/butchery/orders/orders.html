<div class="orders-container">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Bestellungen</h1>
        <div class="spacer"></div>
    </div>

    <div class="orders-content">
        <mat-card class="orders-card">
            <mat-card-header>
                <mat-card-title>Bestellungen</mat-card-title>
                <mat-card-subtitle>Verwalten Sie hier Ihre Bestellungen</mat-card-subtitle>
                <div class="header-actions">
                    <button mat-stroked-button (click)="openReportDialog()" style="margin-right: 8px;">
                        <mat-icon>picture_as_pdf</mat-icon>
                        Bericht
                    </button>
                    <button mat-raised-button color="primary" (click)="openOrderDialog()">
                        <mat-icon>add</mat-icon>
                        Neue Bestellung
                    </button>
                </div>
            </mat-card-header>
            <mat-card-content>
                <div class="table-container">
                    <div class="table-scroll-wrapper">
                        <table mat-table [dataSource]="dataSource" matSort class="full-width-table">

                            <!-- Date Column -->
                            <ng-container matColumnDef="orderDate">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Datum </th>
                                <td mat-cell *matCellDef="let row"> {{row.orderDate | date:'dd.MM.yyyy'}} </td>
                            </ng-container>

                            <!-- Customer Column -->
                            <ng-container matColumnDef="customerName">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Kunde </th>
                                <td mat-cell *matCellDef="let row"> 
                                    {{row.customerName}}
                                    <div style="font-size: 0.8em; color: gray;" *ngIf="row.customerPhone">{{row.customerPhone}}</div>
                                </td>
                            </ng-container>

                            <!-- Market Column -->
                            <ng-container matColumnDef="market">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Markt </th>
                                <td mat-cell *matCellDef="let row"> {{row.market}} </td>
                            </ng-container>

                            <!-- Items Column -->
                            <ng-container matColumnDef="items">
                                <th mat-header-cell *matHeaderCellDef> Produkte </th>
                                <td mat-cell *matCellDef="let row"> 
                                    <div *ngFor="let item of row.items">
                                        {{item.quantity}} {{item.unit}} {{item.productName}}
                                        <span *ngIf="item.notes" style="font-style: italic; color: gray;">({{item.notes}})</span>
                                    </div>
                                </td>
                            </ng-container>

                            <!-- Actions Column -->
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef> Aktionen </th>
                                <td mat-cell *matCellDef="let row">
                                    <div class="actions-row">
                                        <button mat-icon-button (click)="openOrderDialog(row)" matTooltip="Bearbeiten">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                        <button mat-icon-button color="warn" (click)="deleteOrder(row)" matTooltip="Löschen">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                            <!-- Row shown when there is no matching data. -->
                            <tr class="mat-row" *matNoDataRow>
                                <td class="mat-cell" colspan="5">Keine Daten vorhanden</td>
                            </tr>
                        </table>
                    </div>

                    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Bestellungen pro Seite"></mat-paginator>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
