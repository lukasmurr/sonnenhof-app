<div class="butchery-wrapper">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Metzgerei Management</h1>
        <div class="spacer"></div>
    </div>

    <p class="section-description">Verwalten Sie Ihre Metzgerei-Prozesse und Bestände</p>

    <div class="card-grid">
        <!-- Produkte Card -->
        <mat-card class="section-card products" (click)="navigateToSection('products')"
            *appHasPermission="'product.view'">
            <div class="card-icon"><mat-icon>inventory_2</mat-icon></div>
            <mat-card-title>Produkte</mat-card-title>
            <mat-card-content>
                Verwalten Sie Ihre Produkte, Einheiten und Preise.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>

        <!-- Bestellungen Card -->
        <mat-card class="section-card orders" (click)="navigateToSection('orders')" *appHasPermission="'order.view'">
            <div class="card-icon"><mat-icon>shopping_cart</mat-icon></div>
            <mat-card-title>Bestellungen</mat-card-title>
            <mat-card-content>
                Übersicht aller Bestellungen und Kundenanfragen.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>

        <!-- Kisten Card -->
        <mat-card class="section-card crates" (click)="navigateToSection('crates')" *appHasPermission="'crate.view'">
            <div class="card-icon"><mat-icon>inbox</mat-icon></div>
            <mat-card-title>Kisten</mat-card-title>
            <mat-card-content>
                Verwalten Sie ausgeliehene rote Kisten.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>
    </div>
</div>
