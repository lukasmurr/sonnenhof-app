<h2 mat-dialog-title>Globale Lagerreihenfolge</h2>
<mat-dialog-content class="print-order-content">
    <p class="hint">Diese Reihenfolge wird beim PDF-Export der Sollliste verwendet.</p>

    @if (items().length > 0) {
    <mat-list class="order-list">
        @for (item of items(); track item.itemId; let i = $index) {
        <mat-list-item class="order-item">
            <div class="item-row">
                <div class="item-label">
                    <span class="item-index">{{ i + 1 }}.</span>
                    <span>{{ item.name }}</span>
                    <span class="item-unit">({{ item.unit }})</span>
                </div>
                <div class="item-actions">
                    <mat-form-field appearance="outline" class="position-input" subscriptSizing="dynamic">
                        <mat-label>Position</mat-label>
                        <input
                            #positionInput
                            matInput
                            type="number"
                            inputmode="numeric"
                            min="1"
                            [max]="items().length"
                            [value]="i + 1"
                            (change)="setPositionFromInput(i, positionInput.value)"
                            [attr.aria-label]="'Position fuer ' + item.name">
                    </mat-form-field>

                    <button mat-stroked-button class="move-btn" (click)="moveBy(i, -10)" [disabled]="i === 0" [attr.aria-label]="item.name + ' zehn Positionen nach oben verschieben'">
                        <mat-icon>keyboard_double_arrow_up</mat-icon>
                        -10
                    </button>
                    <button mat-stroked-button class="move-btn" (click)="moveBy(i, -1)" [disabled]="i === 0" [attr.aria-label]="item.name + ' eine Position nach oben verschieben'">
                        <mat-icon>keyboard_arrow_up</mat-icon>
                        -1
                    </button>
                    <button mat-stroked-button class="move-btn" (click)="moveBy(i, 1)" [disabled]="i === items().length - 1" [attr.aria-label]="item.name + ' eine Position nach unten verschieben'">
                        <mat-icon>keyboard_arrow_down</mat-icon>
                        +1
                    </button>
                    <button mat-stroked-button class="move-btn" (click)="moveBy(i, 10)" [disabled]="i === items().length - 1" [attr.aria-label]="item.name + ' zehn Positionen nach unten verschieben'">
                        <mat-icon>keyboard_double_arrow_down</mat-icon>
                        +10
                    </button>
                </div>
            </div>
        </mat-list-item>
        }
    </mat-list>
    } @else {
    <p>Keine Produkte vorhanden.</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="close()">Abbrechen</button>
    <button mat-raised-button color="primary" (click)="save()">Speichern</button>
</mat-dialog-actions>
