<h2 mat-dialog-title>Globale Lagerreihenfolge</h2>
<mat-dialog-content>
    <p class="hint">Diese Reihenfolge wird beim PDF-Export der Sollliste verwendet.</p>

    @if (items().length > 0) {
    <mat-list>
        @for (item of items(); track item.itemId; let i = $index) {
        <mat-list-item>
            <div class="item-row">
                <div class="item-label">
                    <span class="item-index">{{ i + 1 }}.</span>
                    <span>{{ item.name }}</span>
                    <span class="item-unit">({{ item.unit }})</span>
                </div>
                <div class="item-actions">
                    <button mat-icon-button (click)="moveUp(i)" [disabled]="i === 0" aria-label="Nach oben verschieben">
                        <mat-icon>arrow_upward</mat-icon>
                    </button>
                    <button mat-icon-button (click)="moveDown(i)" [disabled]="i === items().length - 1" aria-label="Nach unten verschieben">
                        <mat-icon>arrow_downward</mat-icon>
                    </button>
                </div>
            </div>
        </mat-list-item>
        }
    </mat-list>
    } @else {
    <p>Keine Produkte vorhanden.</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="close()">Abbrechen</button>
    <button mat-raised-button color="primary" (click)="save()">Speichern</button>
</mat-dialog-actions>
