<div class="products-container">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Produktverwaltung</h1>
        <div class="spacer"></div>
    </div>

    <div class="products-content">
        <mat-card class="products-card">
            <mat-card-header>
                <mat-card-title>Produkte</mat-card-title>
                <mat-card-subtitle>Verwalten Sie hier Ihre Produkte</mat-card-subtitle>
                <div class="header-actions">
                    <button mat-raised-button color="primary" (click)="openProductDialog()" *appHasPermission="'product.create'">
                        <mat-icon>add</mat-icon>
                        Neues Produkt
                    </button>
                </div>
            </mat-card-header>
            <mat-card-content>
                <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 16px;"
                    subscriptSizing="dynamic">
                    <mat-label>Suchen</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Nach Name oder PU-Nummer suchen..."
                        #input>
                    <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>

                <div class="table-container">
                    <div class="table-scroll-wrapper">
                        <table mat-table [dataSource]="dataSource" matSort class="full-width-table">

                            <!-- PU Number Column -->
                            <ng-container matColumnDef="puNumber">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> PU Nummer </th>
                                <td mat-cell *matCellDef="let row"> {{row.puNumber}} </td>
                            </ng-container>

                            <!-- Name Column -->
                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                                <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                            </ng-container>

                            <!-- Unit Column -->
                            <ng-container matColumnDef="unit">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Einheit </th>
                                <td mat-cell *matCellDef="let row"> {{row.unit}} </td>
                            </ng-container>

                            <!-- Actions Column -->
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef> Aktionen </th>
                                <td mat-cell *matCellDef="let row">
                                    <div class="actions-row">
                                        <button mat-icon-button (click)="openProductDialog(row)" matTooltip="Bearbeiten"
                                            *appHasPermission="'product.update'">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                        <button mat-icon-button color="warn" (click)="deleteProduct(row)"
                                            matTooltip="Löschen" *appHasPermission="'product.delete'">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                            <!-- Row shown when there is no matching data. -->
                            <tr class="mat-row" *matNoDataRow>
                                <td class="mat-cell" colspan="4">Keine Daten vorhanden</td>
                            </tr>
                        </table>
                    </div>

                    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]"
                        aria-label="Produkte pro Seite"></mat-paginator>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
