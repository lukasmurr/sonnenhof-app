<div class="products-container">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button mat-icon-button (click)="goBack()">
                <mat-icon>arrow_back</mat-icon>
            </button>
            <h1>Produktverwaltung</h1>
        </div>
        <button mat-fab color="primary" (click)="openProductDialog()" aria-label="Neues Produkt hinzufügen">
            <mat-icon>add</mat-icon>
        </button>
    </div>

    <div class="table-container mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- PU Number Column -->
            <ng-container matColumnDef="puNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> PU Nummer </th>
                <td mat-cell *matCellDef="let row"> {{row.puNumber}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                <td mat-cell *matCellDef="let row"> {{row.name}} </td>
            </ng-container>

            <!-- Unit Column -->
            <ng-container matColumnDef="unit">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Einheit </th>
                <td mat-cell *matCellDef="let row"> {{row.unit}} </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Aktionen </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="accent"(click)="openProductDialog(row)" matTooltip="Bearbeiten">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteProduct(row)" matTooltip="Löschen">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">Keine Daten vorhanden</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Produkte pro Seite"></mat-paginator>
    </div>
</div>
