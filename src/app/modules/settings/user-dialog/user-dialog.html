<h2 mat-dialog-title>{{ isEditMode ? 'Benutzer bearbeiten' : 'Neuer Benutzer' }}</h2>
<mat-dialog-content>
  <form [formGroup]="userForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Max Mustermann">
      <mat-error *ngIf="userForm.get('name')?.hasError('required')">Name ist erforderlich</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" placeholder="max@beispiel.de" type="email">
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">Email ist erforderlich</mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">Ungültige Email-Adresse</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Passwort</mat-label>
      <input matInput formControlName="password" type="password" [placeholder]="isEditMode ? 'Leer lassen um beizubehalten' : 'Passwort'">
      <mat-error *ngIf="userForm.get('password')?.hasError('required')">Passwort ist erforderlich</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Rolle</mat-label>
      <mat-select formControlName="role">
        <mat-option value="admin">Admin</mat-option>
        <mat-option value="user">Benutzer</mat-option>
        <mat-option value="viewer">Zuschauer</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="checkbox-container">
      <mat-checkbox formControlName="isLocked">Benutzer gesperrt</mat-checkbox>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Abbrechen</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="userForm.invalid">Speichern</button>
</mat-dialog-actions>
