<div class="settings-wrapper">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Einstellungen</h1>
        <div class="spacer"></div>
    </div>

    <div class="settings-content">
        <mat-card class="settings-card">
            <mat-card-header>
                <mat-card-title>Benutzerverwaltung</mat-card-title>
                <mat-card-subtitle>Verwalten Sie hier die Zugänge zur App</mat-card-subtitle>
                <div class="header-actions">
                    <button mat-raised-button color="primary" (click)="openUserDialog()">
                        <mat-icon>add</mat-icon>
                        Neuer Benutzer
                    </button>
                </div>
            </mat-card-header>
            <mat-card-content>
                <div class="table-container">
                    <table mat-table [dataSource]="users" class="full-width-table">
                        <!-- Name Column -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef> Name </th>
                            <td mat-cell *matCellDef="let user"> {{user.name}} </td>
                        </ng-container>

                        <!-- Email Column -->
                        <ng-container matColumnDef="email">
                            <th mat-header-cell *matHeaderCellDef> Email </th>
                            <td mat-cell *matCellDef="let user"> {{user.email}} </td>
                        </ng-container>

                        <!-- Role Column -->
                        <ng-container matColumnDef="role">
                            <th mat-header-cell *matHeaderCellDef> Rolle </th>
                            <td mat-cell *matCellDef="let user">
                                <span class="role-badge" [class.role-admin]="user.role === 'admin'" [class.role-user]="user.role !== 'admin'">
                                    {{user.role | titlecase}}
                                </span>
                            </td>
                        </ng-container>

                        <!-- Status Column -->
                        <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef> Status </th>
                            <td mat-cell *matCellDef="let user">
                                <span [class.status-locked]="user.isLocked" [class.status-active]="!user.isLocked">
                                    {{user.isLocked ? 'Gesperrt' : 'Aktiv'}}
                                </span>
                            </td>
                        </ng-container>

                        <!-- Actions Column -->
                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef> Aktionen </th>
                            <td mat-cell *matCellDef="let user">
                                <div class="actions-row">
                                    <button mat-icon-button (click)="openUserDialog(user)" matTooltip="Benutzer bearbeiten">
                                        <mat-icon>edit</mat-icon>
                                    </button>
                                    <button mat-icon-button (click)="toggleLock(user)" [matTooltip]="user.isLocked ? 'Benutzer entsperren' : 'Benutzer sperren'">
                                        <mat-icon>{{user.isLocked ? 'lock_open' : 'lock'}}</mat-icon>
                                    </button>
                                    <button mat-icon-button (click)="changePassword(user)" matTooltip="Passwort ändern">
                                        <mat-icon>key</mat-icon>
                                    </button>
                                    <button mat-icon-button (click)="deleteUser(user)" color="warn" matTooltip="Benutzer löschen">
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </div>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
