<div class="settings-wrapper">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Einstellungen</h1>
        <div class="spacer"></div>
    </div>

    <div class="settings-content">
        <mat-card class="settings-card">
            <mat-card-header>
                <mat-card-title>Benutzerverwaltung</mat-card-title>
                <mat-card-subtitle>Verwalten Sie hier die Zugänge zur App</mat-card-subtitle>
                <div class="header-actions">
                    <button mat-raised-button color="primary" (click)="openUserDialog()">
                        <mat-icon>add</mat-icon>
                        Neuer Benutzer
                    </button>
                </div>
            </mat-card-header>
            <mat-card-content>
                <div class="table-container">
                    <table mat-table [dataSource]="users" class="full-width-table">
                        <!-- Name Column -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef> Name </th>
                            <td mat-cell *matCellDef="let user"> {{user.name}} </td>
                        </ng-container>

                        <!-- Email Column -->
                        <ng-container matColumnDef="email">
                            <th mat-header-cell *matHeaderCellDef> Email </th>
                            <td mat-cell *matCellDef="let user"> {{user.email}} </td>
                        </ng-container>

                        <!-- Role Column -->
                        <ng-container matColumnDef="role">
                            <th mat-header-cell *matHeaderCellDef> Rolle </th>
                            <td mat-cell *matCellDef="let user">
                                <mat-chip-option [color]="user.role === 'admin' ? 'warn' : 'primary'" selected>
                                    {{user.role | titlecase}}
                                </mat-chip-option>
                            </td>
                        </ng-container>

                        <!-- Status Column -->
                        <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef> Status </th>
                            <td mat-cell *matCellDef="let user">
                                <span [class.status-locked]="user.isLocked" [class.status-active]="!user.isLocked">
                                    {{user.isLocked ? 'Gesperrt' : 'Aktiv'}}
                                </span>
                            </td>
                        </ng-container>

                        <!-- Actions Column -->
                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef> Aktionen </th>
                            <td mat-cell *matCellDef="let user">
                                <div>
                                    <button mat-menu-item (click)="openUserDialog(user)">
                                        <mat-icon>edit</mat-icon>
                                        <!-- <span>Bearbeiten</span> ToDo:tooltip -->
                                    </button>
                                    <button mat-menu-item (click)="toggleLock(user)">
                                        <mat-icon>{{user.isLocked ? 'lock_open' : 'lock'}}</mat-icon>
                                        <!-- <span>{{user.isLocked ? 'Entsperren' : 'Sperren'}}</span> -->
                                    </button>
                                    <button mat-menu-item (click)="deleteUser(user)" class="delete-item">
                                        <mat-icon color="warn">delete</mat-icon>
                                        <!-- <span>Löschen</span> -->
                                    </button>
                                </div>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
