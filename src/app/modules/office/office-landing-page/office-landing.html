<div class="office-wrapper">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Büro Management</h1>
        <div class="spacer"></div>
    </div>

    <p class="section-description">Verwalten Sie Ihre Büroprozesse und Verwaltungsaufgaben</p>

    <div class="card-grid">
        <!-- TÜV Card -->
        <mat-card class="section-card tuev" (click)="navigateToSection('tuev')" *appHasPermission="'tuev.view'">
            <div class="card-icon"><mat-icon>fact_check</mat-icon></div>
            <mat-card-title>TÜV</mat-card-title>
            <mat-card-content>
                TÜV Termine und Prüfungen.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>

        <!-- Märkte Card -->
        <mat-card class="section-card markets" (click)="navigateToSection('markets')" *appHasPermission="'market.view'">
            <div class="card-icon"><mat-icon>storefront</mat-icon></div>
            <mat-card-title>Märkte</mat-card-title>
            <mat-card-content>
                Marktübersicht und Planung.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>

        <!-- Mitarbeiter Card -->
        <mat-card class="section-card employees" (click)="navigateToSection('employees')"
            *appHasPermission="'employee.view'">
            <div class="card-icon"><mat-icon>people</mat-icon></div>
            <mat-card-title>Mitarbeiter</mat-card-title>
            <mat-card-content>
                Mitarbeiterverwaltung und Kontaktdaten.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>

        <!-- Urlaubsplanung Card -->
        <mat-card class="section-card vacation" (click)="navigateToSection('vacation')"
            *appHasPermission="'vacation.view'">
            <div class="card-icon"><mat-icon>date_range</mat-icon></div>
            <mat-card-title>Urlaubsplanung</mat-card-title>
            <mat-card-content>
                Urlaubsübersicht und Planung.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>
    </div>
</div>
