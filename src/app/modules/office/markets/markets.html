<div class="markets-container">
    <div class="header">
        <h1>Märkte</h1>
        <button mat-fab color="primary" (click)="openMarketDialog()" aria-label="Neuen Markt hinzufügen">
            <mat-icon>add</mat-icon>
        </button>
    </div>

    <div class="table-container mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                <td mat-cell *matCellDef="let row"> {{row.name}} </td>
            </ng-container>

            <!-- Address Column -->
            <ng-container matColumnDef="address">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Adresse </th>
                <td mat-cell *matCellDef="let row"> {{row.address}} </td>
            </ng-container>

            <!-- Day Column -->
            <ng-container matColumnDef="day">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Tag </th>
                <td mat-cell *matCellDef="let row"> {{row.day}} </td>
            </ng-container>

            <!-- Time Column -->
            <ng-container matColumnDef="time">
                <th mat-header-cell *matHeaderCellDef> Zeit </th>
                <td mat-cell *matCellDef="let row"> {{row.startTime}} - {{row.endTime}} </td>
            </ng-container>

            <!-- Car Column -->
            <ng-container matColumnDef="car">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Auto </th>
                <td mat-cell *matCellDef="let row"> Auto {{row.car}} </td>
            </ng-container>

            <!-- Grill Trailer Column -->
            <ng-container matColumnDef="hasGrillTrailer">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Grillhänger </th>
                <td mat-cell *matCellDef="let row">
                    <mat-icon *ngIf="row.hasGrillTrailer" color="primary">check_circle</mat-icon>
                    <mat-icon *ngIf="!row.hasGrillTrailer" color="disabled">cancel</mat-icon>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Aktionen </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary" (click)="openMarketDialog(row)" matTooltip="Bearbeiten">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteMarket(row)" matTooltip="Löschen">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="7">Keine Märkte vorhanden</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Märkte pro Seite"></mat-paginator>
    </div>
</div>
