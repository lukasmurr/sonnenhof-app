<div class="employees-container">
    <div class="header">
        <h1>Mitarbeiter</h1>
        <button mat-fab color="primary" (click)="openEmployeeDialog()" aria-label="Neuen Mitarbeiter hinzufügen">
            <mat-icon>add</mat-icon>
        </button>
    </div>

    <div class="table-container mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                <td mat-cell *matCellDef="let row"> {{row.name}} </td>
            </ng-container>

            <!-- BirthDate Column -->
            <ng-container matColumnDef="birthDate">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Geburtsdatum </th>
                <td mat-cell *matCellDef="let row"> {{row.birthDate | date:'dd.MM.yyyy'}} </td>
            </ng-container>

            <!-- Contact Column -->
            <ng-container matColumnDef="contact">
                <th mat-header-cell *matHeaderCellDef> Kontakt </th>
                <td mat-cell *matCellDef="let row">
                    <div *ngIf="row.mobile">Mobil: {{row.mobile}}</div>
                    <div *ngIf="row.landline">Festnetz: {{row.landline}}</div>
                    <div *ngIf="row.email">Email: {{row.email}}</div>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Aktionen </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary" (click)="openEmployeeDialog(row)" matTooltip="Bearbeiten">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteEmployee(row)" matTooltip="Löschen">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">Keine Mitarbeiter gefunden</td>
            </tr>
        </table>
    </div>
</div>
