<h2 mat-dialog-title>{{ data.vacation ? 'Urlaub bearbeiten' : 'Neuer Urlaub' }}</h2>
<mat-dialog-content>
    <form [formGroup]="form" class="vacation-form">
        <mat-form-field appearance="outline">
            <mat-label>Mitarbeiter</mat-label>
            <mat-select formControlName="employeeId">
                <mat-option *ngFor="let emp of employees" [value]="emp._id">
                    {{ emp.name }}
                </mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('employeeId')?.hasError('required')">
                Mitarbeiter ist erforderlich
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Zeitraum</mat-label>
            <mat-date-range-input [rangePicker]="picker">
                <input matStartDate formControlName="startDate" placeholder="Startdatum">
                <input matEndDate formControlName="endDate" placeholder="Enddatum">
            </mat-date-range-input>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-date-range-picker #picker></mat-date-range-picker>
            <mat-error *ngIf="form.get('startDate')?.hasError('required') || form.get('endDate')?.hasError('required')">
                Zeitraum ist erforderlich
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
                <mat-option value="pending">Ausstehend</mat-option>
                <mat-option value="approved">Genehmigt</mat-option>
                <mat-option value="rejected">Abgelehnt</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Bemerkung</mat-label>
            <textarea matInput formControlName="notes" rows="3"></textarea>
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Abbrechen</button>
    <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">
        Speichern
    </button>
</mat-dialog-actions>
