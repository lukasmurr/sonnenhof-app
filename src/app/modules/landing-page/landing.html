<div class="landing-wrapper">
    <h1 class="headline">Willkommen in der Sonnenhof App</h1>

    <div class="card-grid">
        <mat-card class="landing-card" (click)="navigate('butchery')" color="primary" *appHasPermission="'butchery.view'">
            <div class="card-icon">
                <img src="assets/icons/pig.svg" alt="Metzgerei">
            </div>
            <mat-card-title>Metzgerei</mat-card-title>
        </mat-card>

        <mat-card class="landing-card" (click)="navigate('office')" *appHasPermission="'office.view'">
            <div class="card-icon">
                <img src="assets/icons/office.svg" alt="Büro">
            </div>
            <mat-card-title>Büro</mat-card-title>
        </mat-card>

        <mat-card class="landing-card" (click)="navigate('farming')">
            <div class="card-icon">
                <img src="assets/icons/traktor.svg" alt="Landwirtschaft">
            </div>
            <mat-card-title>Landwirtschaft</mat-card-title>
        </mat-card>
    </div>
</div>
