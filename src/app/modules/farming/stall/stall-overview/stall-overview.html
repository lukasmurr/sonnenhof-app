<div class="stall-overview-wrapper">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Stall Übersicht</h1>
        <div class="spacer"></div>
    </div>

    <div class="card-grid">
        <mat-card *ngFor="let stall of stalls$ | async" class="stall-card" (click)="openStall(stall._id)">
            <mat-card-header>
                <mat-card-title>{{ stall.name }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div class="stat-row">
                    <mat-icon>pets</mat-icon>
                    <span>Schweine gesamt: {{ getTotalPigs(stall) }}</span>
                </div>
                <div class="stat-row">
                    <mat-icon>grid_view</mat-icon>
                    <span>Boxen: {{ stall.boxes.length }}</span>
                </div>
                <div class="stat-row">
                    <mat-icon>check_box</mat-icon>
                    <span>Belegt: {{ getOccupiedBoxes(stall) }}</span>
                </div>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button>Öffnen</button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
