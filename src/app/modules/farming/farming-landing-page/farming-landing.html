<div class="farming-wrapper">
    <div class="header">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="headline">Landwirtschaft Management</h1>
        <div class="spacer"></div>
    </div>

    <p class="section-description">Verwalten Sie Ihre landwirtschaftlichen Ressourcen und Prozesse</p>

    <div class="card-grid">
        <!-- Stall Card -->
        <mat-card class="section-card stall" (click)="navigateToSection('stall')" *appHasPermission="'stall.view'">
            <div class="card-icon"><mat-icon>house</mat-icon></div>
            <mat-card-title>Stall</mat-card-title>
            <mat-card-content>
                Stallverwaltung und Übersicht.
            </mat-card-content>
            <button mat-raised-button class="action-button">Öffnen</button>
        </mat-card>
    </div>
</div>
