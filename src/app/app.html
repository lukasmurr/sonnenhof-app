<mat-toolbar *ngIf="showToolbar()" class="app-toolbar">
  <!-- Logo/Brand + Home -->
  <div class="toolbar-logo" (click)="navigateHome()">
    <img src="assets/favicon.ico" alt="Sonnenhof Logo" class="toolbar-logo-image">
  </div>

  <!-- Flex Spacer -->
  <span class="spacer"></span>

  <!-- Settings Icon Button -->
  <button mat-icon-button (click)="navigateSettings()" class="toolbar-button" color="accent" matTooltip="Einstellungen">
    <mat-icon>settings</mat-icon>
  </button>

  <!-- User Menu -->
  <div class="user-menu-container">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger" color="accent">
      <mat-icon class="user-avatar">account_circle</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" class="user-menu">
      <button mat-menu-item (click)="profile()">
        <mat-icon>person</mat-icon>
        <span>Profil anzeigen</span>
      </button>
      <button mat-menu-item routerLink="/settings">
        <mat-icon>security</mat-icon>
        <span>Sicherheit</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Abmelden</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<router-outlet />
