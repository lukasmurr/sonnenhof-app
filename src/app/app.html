<mat-toolbar *ngIf="showToolbar()" class="app-toolbar">
  <!-- Logo/Brand + Home -->
  <div class="toolbar-logo" (click)="navigateHome()">
    <img src="assets/favicon.ico" alt="Sonnenhof Logo" class="toolbar-logo-image">
  </div>

  <!-- Flex Spacer -->
  <span class="spacer"></span>

  <!-- Settings Icon Button -->
  <button *ngIf="authService.isAdmin()" mat-icon-button (click)="navigateSettings()" class="toolbar-button" color="accent" matTooltip="Einstellungen">
    <mat-icon>settings</mat-icon>
  </button>

  <!-- User Menu -->
  <div class="user-menu-container">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger" color="accent">
      <mat-icon class="user-avatar">account_circle</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" class="user-menu">
      <div class="user-info-item" (click)="$event.stopPropagation()">
        <div class="user-name">{{ authService.userName() }}</div>
        <div class="user-email">{{ authService.getCurrentUser() }}</div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="openChangePasswordDialog()">
        <mat-icon>lock_reset</mat-icon>
        <span>Passwort ändern</span>
      </button>
      <button *ngIf="authService.isAdmin()" mat-menu-item routerLink="/settings">
        <mat-icon>security</mat-icon>
        <span>Sicherheit</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Abmelden</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<router-outlet />
